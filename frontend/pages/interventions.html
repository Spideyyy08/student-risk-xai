<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intervention Log — VIT Academic Risk</title>
  <meta name="description" content="Log and monitor personalized early interventions, faculty counselling sessions, and parent meetings." />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body data-page-title="Intervention Log">

  <div class="grid-5-7">
    <!-- Left Box: New Intervention Form -->
    <section class="card" aria-labelledby="headingNewIntervention">
      <div class="card-header">
        <div>
          <h2 class="card-title" id="headingNewIntervention">Log New Intervention</h2>
          <div class="card-subtitle">Document faculty guidance or support action</div>
        </div>
      </div>
      <div class="card-body">
        <form id="newInterventionForm">
          <div class="form-group">
            <label for="intStudentSelect" class="form-label">Student</label>
            <select id="intStudentSelect" class="form-select" required>
              <option value="">Select student...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="intTypeSelect" class="form-label">Intervention Type</label>
            <select id="intTypeSelect" class="form-select" required>
              <option value="Counselling">Counselling</option>
              <option value="Extra class">Extra class</option>
              <option value="Parent meeting">Parent meeting</option>
              <option value="Mentor assigned">Mentor assigned</option>
            </select>
          </div>

          <div class="form-group">
            <label for="intStatusSelect" class="form-label">Initial Status</label>
            <select id="intStatusSelect" class="form-select" required>
              <option value="Planned">Planned</option>
              <option value="In progress">In progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div class="form-group">
            <label for="intDateInput" class="form-label">Target Date</label>
            <input type="date" id="intDateInput" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="intNotesInput" class="form-label">Intervention Notes &amp; Action Items</label>
            <textarea id="intNotesInput" class="form-textarea" placeholder="Detail root cause identified, support assigned, and agreed commitments..." required></textarea>
          </div>

          <div id="intFormMessage" style="display: none; margin-bottom: 12px; font-size: 12.5px;"></div>

          <button type="submit" class="btn btn-primary" id="btnSaveIntervention" style="width: 100%;">
            Save Intervention Entry
          </button>
        </form>
      </div>
    </section>

    <!-- Right Box: Logged Interventions Table -->
    <section class="card" aria-labelledby="headingLoggedInterventions">
      <div class="card-header" style="flex-wrap: wrap;">
        <div>
          <h2 class="card-title" id="headingLoggedInterventions">Logged Academic Interventions</h2>
          <div class="card-subtitle" id="interventionStatsSubtitle">Historical and active records</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <label for="statusFilterSelect" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Status filter</label>
          <select id="statusFilterSelect" class="form-select" style="width: auto; padding: 4px 8px; font-size: 12px;">
            <option value="ALL">All Statuses</option>
            <option value="Planned">Planned</option>
            <option value="In progress">In progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
      </div>
      <div class="card-body" style="padding: 0;">
        <div class="table-container" style="border: none;">
          <table class="table" id="interventionsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Student</th>
                <th>Type</th>
                <th>Status</th>
                <th>Action Notes</th>
              </tr>
            </thead>
            <tbody id="interventionsTableBody">
              <tr><td colspan="5" class="state-loading">Loading logged interventions...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/mock-data.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/custom-select.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/interventions.js"></script>
</body>
</html>
